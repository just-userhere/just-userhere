# Generates animated contribution-graph SVGs (pacman + snake) and publishes
# them to the `output` branch, where the profile README embeds them.
# Run manually once (Actions tab -> Run workflow) so the `output` branch
# and SVGs exist; afterwards it refreshes daily via cron.

name: profile contribution games

on:
  schedule: # every 24 hours
    - cron: "0 0 * * *"
  workflow_dispatch: # manual trigger
  push: # refresh on profile README/workflow updates
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # Pacman eats your contributions while ghosts give chase.
      - name: generate pacman contribution graph
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}
          games: "pacman"

      # Snake eats your contributions, dark + light variants.
      - name: generate snake contribution graphs
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Single push so both games land on the `output` branch together.
      - name: push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
