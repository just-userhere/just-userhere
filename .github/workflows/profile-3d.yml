# Generates 3D contribution-profile SVGs into ./profile-3d-contrib/ on main.
# Run manually once (Actions tab -> Run workflow) so the SVGs exist for the
# README embed; afterwards it refreshes daily via cron.

name: GitHub-Profile-3D-Contrib

on:
  schedule: # 03:00 JST == 18:00 UTC
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Commit & Push
        run: |
          git config user.name just-userhere
          git config user.email 178766249+just-userhere@users.noreply.github.com
          git add -A .
          if git commit -m "generated"; then
            git push
          fi
